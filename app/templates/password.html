{% extends 'base.html' %}
{% block title %}修改密码 · {{ app_short }}{% endblock %}
{% block page_title %}修改密码{% endblock %}
{% block page_sub %}密码采用加盐哈希存储，修改后需要重新登录{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card">
      <div class="card-header"><span><i class="bi bi-key me-1"></i>修改本人登录密码</span></div>
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label required">原密码</label>
            <input class="form-control" type="password" name="old_password" required>
          </div>
          <div class="mb-3">
            <label class="form-label required">新密码</label>
            <input class="form-control" type="password" name="new_password" minlength="6" required>
            <div class="form-text">长度不少于 6 位。</div>
          </div>
          <div class="mb-3">
            <label class="form-label required">确认新密码</label>
            <input class="form-control" type="password" name="confirm_password" minlength="6" required>
          </div>
          <button class="btn btn-success" type="submit"><i class="bi bi-check-lg me-1"></i>确认修改</button>
          <a class="btn btn-light border" href="{{ url_for('dashboard.index') }}">返回工作台</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
