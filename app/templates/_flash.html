{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flash-wrap">
      {% for category, message in messages %}
        <div class="alert alert-{{ category if category in ['success','danger','warning','info','primary','secondary'] else 'info' }} alert-dismissible fade show py-2 mb-2"
             role="alert">
          <i class="bi {% if category == 'success' %}bi-check-circle{% elif category == 'danger' %}bi-x-circle{% elif category == 'warning' %}bi-exclamation-triangle{% else %}bi-info-circle{% endif %} me-1"></i>
          {{ message }}
          <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert" aria-label="关闭"></button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
