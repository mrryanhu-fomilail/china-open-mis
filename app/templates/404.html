{% extends 'base.html' %}
{% block title %}页面不存在 · {{ app_short }}{% endblock %}
{% block page_title %}页面不存在{% endblock %}
{% block page_sub %}404 Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-body text-center py-5">
        <i class="bi bi-compass display-5 text-secondary"></i>
        <h5 class="mt-3">没有找到这个页面</h5>
        <p class="text-muted small">请检查地址是否正确，或从菜单重新进入。</p>
        {% if current_staff %}
          <a class="btn btn-success" href="{{ url_for('dashboard.index') }}">返回工作台</a>
        {% else %}
          <a class="btn btn-success" href="{{ url_for('public.index') }}">返回查询首页</a>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
